  /* Markenfarben Köhler – heller Modus (Standard) */
  :root {
    --anthrazit: #666666;
    --petrol: #00848A;
    --petrol-dark: #006B70;
    --hellgrau: #D8D8D8;
    --hellgrau-hell: #F1F1F1;
    --signalorange: #E8622C;
    --weiss: #FFFFFF;

    --bg: var(--hellgrau-hell);
    --surface: var(--weiss);
    --surface-alt: var(--hellgrau);
    --border: var(--hellgrau);
    --text: var(--anthrazit);
    --text-on-accent: var(--weiss);
    --accent: var(--petrol);
    --accent-strong: var(--petrol-dark);
    --warn: var(--signalorange);
    --overlay: rgba(0, 0, 0, 0.45);
  }
  /* Bewusst einthemig: immer heller Hintergrund, unabhängig vom Systemschema. */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Aptos', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.4;
  }
  .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; font-variant-numeric: tabular-nums; }
  a { color: var(--accent-strong); }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

  header.app-header {
    background: var(--accent);
    color: var(--text-on-accent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header.app-header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header.app-header .sub {
    font-size: 12px;
    opacity: 0.85;
    font-weight: 400;
  }
  .user-switch {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .user-switch select {
    padding: 5px 8px;
    border-radius: 4px;
    border: none;
    font-family: inherit;
  }
  .role-badge {
    background: rgba(255,255,255,0.22);
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  nav.tabs {
    background: var(--surface-alt);
    display: flex;
    gap: 4px;
    padding: 0 16px;
    flex-wrap: wrap;
  }
  nav.tabs button {
    background: none;
    border: none;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  nav.tabs button.active {
    color: var(--accent-strong);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  nav.tabs button:hover { color: var(--accent-strong); }

  main { padding: 20px; max-width: 1400px; margin: 0 auto; }

  .btn {
    font-family: inherit;
    font-size: 13px;
    border: none;
    border-radius: 4px;
    padding: 7px 13px;
    cursor: pointer;
    background: var(--surface-alt);
    color: var(--text);
  }
  .btn:hover { filter: brightness(0.96); }
  .btn-primary { background: var(--accent); color: var(--text-on-accent); }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-warn { background: var(--warn); color: var(--text-on-accent); }
  .btn-ghost { background: transparent; color: var(--accent-strong); text-decoration: underline; padding: 4px 6px; }
  .btn-sm { padding: 4px 9px; font-size: 12px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat-tile {
    background: var(--surface);
    border-radius: 6px;
    padding: 12px 14px;
    border-left: 4px solid var(--accent);
  }
  .stat-tile.overdue { border-left-color: var(--warn); }
  .stat-tile .num { font-size: 24px; font-weight: 600; display: block; }
  .stat-tile .lbl { font-size: 12px; color: var(--text); opacity: 0.8; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .filter-bar input[type=text], .filter-bar select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
  }
  .filter-bar label { font-size: 13px; display: flex; align-items: center; gap: 5px; }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }
  .col {
    background: var(--bg);
    border-radius: 6px;
    padding: 10px;
    min-height: 80px;
  }
  .col h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 2px 0 10px 4px;
    color: var(--text);
  }
  .col h3 .cnt { font-family: 'IBM Plex Mono', monospace; color: var(--accent-strong); }

  .card {
    background: var(--surface);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
    border-left: 4px solid var(--border);
    cursor: pointer;
  }
  .card.overdue { border-left-color: var(--warn); }
  .card .title { font-weight: 600; margin-bottom: 4px; cursor: pointer; }
  .card .meta { font-size: 12px; color: var(--text); opacity: 0.85; margin-bottom: 4px; }
  .card .meta .deadline { font-family: 'IBM Plex Mono', monospace; }
  .card .meta .deadline.overdue { color: var(--warn); font-weight: 600; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--surface-alt);
    color: var(--text);
    margin-right: 4px;
  }
  .badge.prio-1 { background: var(--warn); color: var(--text-on-accent); }
  .badge.prio-2 { background: var(--accent); color: var(--text-on-accent); }
  .badge.prio-3 { background: var(--surface-alt); color: var(--text); }
  .badge.overdue-badge { background: var(--warn); color: var(--text-on-accent); }

  .progress-outer {
    background: var(--surface-alt);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    margin: 6px 0;
  }
  .progress-inner { background: var(--accent); height: 100%; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .empty-hint { color: var(--text); opacity: 0.6; font-size: 13px; padding: 10px 4px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: var(--overlay);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .modal {
    background: var(--surface); border-radius: 8px; padding: 22px;
    width: 100%; max-width: 560px;
  }
  .modal h2 { margin-top: 0; font-size: 17px; color: var(--accent-strong); text-wrap: balance; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
  .field input[type=text], .field input[type=date], .field select, .field textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 4px;
    font-family: inherit; font-size: 14px; background: var(--surface); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .note-item, .hist-item { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .note-item .meta, .hist-item .meta { font-size: 11px; opacity: 0.7; font-family: 'IBM Plex Mono', monospace; }

  .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .proj-card { background: var(--surface); border-radius: 6px; padding: 14px; border-top: 4px solid var(--accent); }
  .proj-card.inactive { border-top-color: var(--border); opacity: 0.75; }
  .proj-card h3 { margin: 0 0 8px 0; font-size: 15px; }
  .proj-card .counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; font-size: 12px; }
  .proj-card .counts span { font-family: 'IBM Plex Mono', monospace; color: var(--accent-strong); }

  table.admin-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 6px; overflow: hidden; }
  table.admin-table th, table.admin-table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  table.admin-table th { background: var(--surface-alt); font-size: 12px; text-transform: uppercase; }

  .section-title { font-size: 15px; font-weight: 600; margin: 22px 0 10px; color: var(--accent-strong); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }

  .storage-note { font-size: 13px; padding: 10px 12px; border-radius: 6px; background: var(--surface); border-left: 4px solid var(--accent); margin-bottom: 14px; }
  .storage-note.warn { border-left-color: var(--warn); }
  .backup-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); padding: 12px; border-radius: 6px; }
  .backup-row input[type=file] { font-family: inherit; font-size: 13px; color: var(--text); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "cbyf_data_v1";

  var STATUS_LABELS = { offen: "Offen", in_bearbeitung: "In Bearbeitung", pruefung: "Zur Prüfung", erledigt: "Erledigt" };
  var STATUS_ORDER = ["offen", "in_bearbeitung", "pruefung", "erledigt"];
  var PRIORITY_LABELS = { 1: "Hoch", 2: "Mittel", 3: "Niedrig" };
  var CATEGORY_OPTIONS = [
    "AI Engineering", "Audio / Voice", "Ausbau", "Bauteile · Elemente · Komponenten",
    "Eigenversorgung (energetische)", "Einkauf", "Energie", "Finanzamt", "Fremdleistungen",
    "Geldverkehr", "Haus & Hof", "Hilfs- & Betriebsstoffe", "Information", "Innovation", "IT",
    "Klima", "Kommunikation", "Konstruktion", "Lebenswerte", "Material", "Mensch",
    "Mitgliedschaften", "Mobilität", "Personal", "Prozess- & Methoden", "Rohbau",
    "Social Media", "Technik", "Unterhaltung", "Versorgung", "Weiterbildung",
    "Werkzeuge · Geräte · Maschinen", "Zentrale Begriffe"
  ];
  var ACTION_FIELD_OPTIONS = [
    "LP 0 Projektvorbereitung", "LP 1 Grundlagenermittlung", "LP 2 Vorplanung",
    "LP 3 Entwurfsplanung", "LP 4 Genehmigungsplanung", "LP 5 Ausführungs- bzw. Werkplanug",
    "LP 6 Vorbereitung der Vergabe", "LP 7 Mitwirkung bei der Vergabe", "LP 8 Bauoberleitung",
    "LP 9 Objektbetreuung", "A", "B"
  ];

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function formatNumber(n) {
    return Number(n || 0).toLocaleString("de-DE");
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function parseDeadline(iso) {
    if (!iso) return null;
    var parts = String(iso).split("T");
    var d = new Date(parts[0] + "T" + (parts[1] || "00:00") + ":00");
    return isNaN(d.getTime()) ? null : d;
  }

  function formatDate(iso) {
    var d = parseDeadline(iso);
    if (!d) return "–";
    return d.toLocaleDateString("de-DE") + ", " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
  }

  function mapsRouteUrl(location) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(location);
  }

  function normalizeUrl(value) {
    value = String(value || "").trim();
    if (!value) return "";
    if (!/^https?:\/\//i.test(value)) value = "https://" + value;
    return value;
  }

  function formatDateTime(ts) {
    return new Date(ts).toLocaleString("de-DE");
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // Manche Ansichten (z.B. eingebettete Artefakte) blockieren localStorage-Zugriff.
  var storageOK = (function () {
    try {
      var k = "__pp_probe__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  })();

  function defaultProjects() {
    return [
      "421 ED SolarKraftwerk",
      "422 Kühlung EFH 48V",
      "423 PV-Freiflächenanlagen (gebäudeunabhängige Solaranlagen)",
      "424 Pull-Project (Task- und Feedback-Modul (MVP))",
      "504 dasFunktionshaus - Waldwiesenhof",
      "556 Hofhäuser Burghofwiese",
      "557 »Golden Ratio«",
      "561 Small Vertical Living · Rostock",
      "562 BAUeinSPARER-HAUS",
      "564 Modulare Baukörper in CLT für Kompaktstationen (Kaysen, Türkei)"
    ].map(function (name) { return { id: uid(), name: name, status: "aktiv" }; });
  }

  function seedData() {
    var u1 = uid();
    return {
      currentUserId: u1,
      users: [
        { id: u1, name: "Gert Köhler", role: "PL" }
      ],
      projects: defaultProjects(),
      tasks: []
    };
  }

  function loadData() {
    if (!storageOK) return seedData();
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seedData();
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.users || !parsed.users.length) return seedData();
      if (!parsed.projects || !parsed.projects.length) parsed.projects = defaultProjects();
      return parsed;
    } catch (e) {
      console.error("Konnte gespeicherte Daten nicht laden, starte neu.", e);
      return seedData();
    }
  }

  function saveData() {
    if (!storageOK) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error("Konnte Daten nicht speichern.", e);
    }
  }

  var data = loadData();
  var ui = {
    tab: "pool",
    filters: { status: "alle", projectId: "alle", assigneeId: "alle", overdueOnly: false, search: "" },
    modal: null
  };

  function currentUser() {
    return data.users.find(function (u) { return u.id === data.currentUserId; }) || data.users[0];
  }
  function isPL() {
    var u = currentUser();
    return !!u && u.role === "PL";
  }
  function userName(id) {
    var u = data.users.find(function (x) { return x.id === id; });
    return u ? u.name : "–";
  }
  function projectName(id) {
    var p = data.projects.find(function (x) { return x.id === id; });
    return p ? p.name : "– kein Projekt –";
  }
  function taskTitle(id) {
    var x = data.tasks.find(function (y) { return y.id === id; });
    return x ? x.title : "–";
  }
  function isOverdue(task) {
    var d = parseDeadline(task.deadline);
    return !!d && task.status !== "erledigt" && d < new Date();
  }
  function addHistory(task, text) {
    task.history.push({ ts: Date.now(), text: text, author: currentUser().name });
  }
  function tasksForProject(pid) {
    return data.tasks.filter(function (t) { return t.projectId === pid; });
  }

  // ---------- Rendering ----------

  function render() {
    var u = currentUser();
    var html = "";
    html += '<header class="app-header">';
    html += '<div><h1>Pull-Project</h1><div class="sub">Aufgaben-Pool im Pull-Prinzip &middot; Ingenieurbüro Köhler</div></div>';
    html += '<div class="user-switch">Angemeldet als';
    html += '<select id="userSwitch" onchange="CbyF.switchUser(this.value)">';
    data.users.forEach(function (usr) {
      html += '<option value="' + usr.id + '"' + (usr.id === u.id ? " selected" : "") + '>' + escapeHtml(usr.name) + '</option>';
    });
    html += '</select>';
    html += '<span class="role-badge">' + (u.role === "PL" ? "Projektleiter" : "Mitarbeiter") + '</span>';
    html += '</div></header>';

    html += '<nav class="tabs">';
    html += tabBtn("pool", "Aufgaben-Pool");
    html += tabBtn("projekte", "Projekte");
    if (isPL()) html += tabBtn("verwaltung", "Verwaltung");
    html += '</nav>';

    html += '<main>';
    if (ui.tab === "pool") html += renderPoolView();
    else if (ui.tab === "projekte") html += renderProjectsView();
    else if (ui.tab === "verwaltung" && isPL()) html += renderAdminView();
    html += '</main>';

    if (ui.modal) html += renderModal();

    document.getElementById("app").innerHTML = html;

    if (ui.tab === "pool") renderPoolList();
    if (ui.modal && ui.modal.focusId) {
      var el = document.getElementById(ui.modal.focusId);
      if (el) el.focus();
    }
  }

  function tabBtn(key, label) {
    return '<button class="' + (ui.tab === key ? "active" : "") + '" onclick="CbyF.setTab(\'' + key + '\')">' + label + '</button>';
  }

  // ---------- Pool ----------

  function renderPoolView() {
    var html = "";
    var counts = { offen: 0, in_bearbeitung: 0, pruefung: 0, erledigt: 0 };
    var overdueCount = 0;
    data.tasks.forEach(function (t) {
      counts[t.status] = (counts[t.status] || 0) + 1;
      if (isOverdue(t)) overdueCount++;
    });

    html += '<div class="stats-row">';
    html += statTile(counts.offen, "Offen");
    html += statTile(counts.in_bearbeitung, "In Bearbeitung");
    html += statTile(counts.pruefung, "Zur Prüfung");
    html += statTile(overdueCount, "Überfällig", true);
    html += '</div>';

    html += '<div class="toolbar"><div></div>';
    if (isPL()) html += '<button class="btn btn-primary" onclick="CbyF.openTaskForm()">+ Neue Aufgabe</button>';
    html += '</div>';

    html += '<div class="filter-bar">';
    html += '<input type="text" id="searchInput" placeholder="Suche in Titel/Beschreibung…" value="' + escapeHtml(ui.filters.search) + '" oninput="CbyF.updateFilter(\'search\', this.value)">';
    html += '<select onchange="CbyF.updateFilter(\'status\', this.value)">';
    html += '<option value="alle"' + (ui.filters.status === "alle" ? " selected" : "") + '>Alle Status</option>';
    STATUS_ORDER.forEach(function (s) {
      html += '<option value="' + s + '"' + (ui.filters.status === s ? " selected" : "") + '>' + STATUS_LABELS[s] + '</option>';
    });
    html += '</select>';
    html += '<select onchange="CbyF.updateFilter(\'projectId\', this.value)">';
    html += '<option value="alle"' + (ui.filters.projectId === "alle" ? " selected" : "") + '>Alle Projekte</option>';
    data.projects.forEach(function (p) {
      html += '<option value="' + p.id + '"' + (ui.filters.projectId === p.id ? " selected" : "") + '>' + escapeHtml(p.name) + '</option>';
    });
    html += '</select>';
    html += '<select onchange="CbyF.updateFilter(\'assigneeId\', this.value)">';
    html += '<option value="alle"' + (ui.filters.assigneeId === "alle" ? " selected" : "") + '>Alle Bearbeiter</option>';
    html += '<option value="unassigned"' + (ui.filters.assigneeId === "unassigned" ? " selected" : "") + '>– offen / niemand –</option>';
    data.users.forEach(function (usr) {
      html += '<option value="' + usr.id + '"' + (ui.filters.assigneeId === usr.id ? " selected" : "") + '>' + escapeHtml(usr.name) + '</option>';
    });
    html += '</select>';
    html += '<label><input type="checkbox" id="overdueOnly"' + (ui.filters.overdueOnly ? " checked" : "") + ' onchange="CbyF.updateFilter(\'overdueOnly\', this.checked)"> Nur überfällige</label>';
    html += '</div>';

    html += '<div id="poolListContainer"></div>';
    return html;
  }

  function statTile(n, label, overdue) {
    return '<div class="stat-tile' + (overdue ? " overdue" : "") + '"><span class="num mono">' + formatNumber(n) + '</span><span class="lbl">' + label + '</span></div>';
  }

  function filteredTasks() {
    var f = ui.filters;
    return data.tasks.filter(function (t) {
      if (f.status !== "alle" && t.status !== f.status) return false;
      if (f.projectId !== "alle" && t.projectId !== f.projectId) return false;
      if (f.assigneeId === "unassigned" && t.assigneeId) return false;
      if (f.assigneeId !== "alle" && f.assigneeId !== "unassigned" && t.assigneeId !== f.assigneeId) return false;
      if (f.overdueOnly && !isOverdue(t)) return false;
      if (f.search) {
        var q = f.search.toLowerCase();
        var hay = (t.title + " " + t.description).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderPoolList() {
    var container = document.getElementById("poolListContainer");
    if (!container) return;
    var tasks = filteredTasks();
    var visibleStatuses = ui.filters.status === "alle" ? STATUS_ORDER : [ui.filters.status];

    var html = '<div class="board">';
    visibleStatuses.forEach(function (status) {
      var colTasks = tasks.filter(function (t) { return t.status === status; })
        .sort(function (a, b) { return (a.deadline || "9999") < (b.deadline || "9999") ? -1 : 1; });
      html += '<div class="col"><h3>' + STATUS_LABELS[status] + ' <span class="cnt">(' + formatNumber(colTasks.length) + ')</span></h3>';
      if (!colTasks.length) html += '<div class="empty-hint">Keine Aufgaben</div>';
      colTasks.forEach(function (t) { html += renderCard(t); });
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderCard(t) {
    var overdue = isOverdue(t);
    var u = currentUser();
    var html = '<div class="card' + (overdue ? " overdue" : "") + '" onclick="CbyF.openTaskDetail(\'' + t.id + '\')">';
    html += '<div class="title">' + escapeHtml(t.title) + '</div>';
    html += '<div class="meta">';
    html += '<span class="badge prio-' + t.priority + '">' + PRIORITY_LABELS[t.priority] + '</span>';
    if (overdue) html += '<span class="badge overdue-badge">Überfällig</span>';
    html += '<span class="badge">' + escapeHtml(projectName(t.projectId)) + '</span>';
    html += '</div>';
    html += '<div class="meta">Frist: <span class="deadline' + (overdue ? " overdue" : "") + '">' + formatDate(t.deadline) + '</span> &middot; Bearbeiter: ' + escapeHtml(t.assigneeId ? userName(t.assigneeId) : "– offen –") + '</div>';
    html += '<div class="progress-outer"><div class="progress-inner" style="width:' + t.progress + '%"></div></div>';
    html += '<div class="meta mono">' + formatNumber(t.progress) + ' %</div>';

    html += '<div class="actions" onclick="event.stopPropagation()">';
    if (t.status === "offen") {
      html += '<button class="btn btn-primary btn-sm" onclick="CbyF.pullTask(\'' + t.id + '\')">Aufgabe holen</button>';
      if (isPL()) {
        html += '<button class="btn btn-sm" onclick="CbyF.openTaskForm(\'' + t.id + '\')">Bearbeiten</button>';
        html += '<button class="btn btn-sm" onclick="CbyF.deleteTask(\'' + t.id + '\')">Löschen</button>';
      }
    } else if (t.status === "in_bearbeitung") {
      if (t.assigneeId === u.id) {
        html += '<button class="btn btn-sm" onclick="CbyF.returnTask(\'' + t.id + '\')">Zurücklegen</button>';
        html += '<button class="btn btn-primary btn-sm" onclick="CbyF.submitForReview(\'' + t.id + '\')">Zur Prüfung einreichen</button>';
      } else if (isPL()) {
        html += '<button class="btn btn-sm" onclick="CbyF.returnTask(\'' + t.id + '\')">Zurück in Pool</button>';
      }
      if (isPL()) html += '<button class="btn btn-sm" onclick="CbyF.openTaskForm(\'' + t.id + '\')">Bearbeiten</button>';
    } else if (t.status === "pruefung") {
      if (isPL()) {
        html += '<button class="btn btn-primary btn-sm" onclick="CbyF.approveTask(\'' + t.id + '\')">Freigeben</button>';
        html += '<button class="btn btn-warn btn-sm" onclick="CbyF.rejectTask(\'' + t.id + '\')">Zurück an Bearbeitung</button>';
      }
    } else if (t.status === "erledigt") {
      if (isPL()) html += '<button class="btn btn-sm" onclick="CbyF.reopenTask(\'' + t.id + '\')">Wiedereröffnen</button>';
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  // ---------- Projects ----------

  function renderProjectsView() {
    var html = '<div class="toolbar"><div></div>';
    if (isPL()) html += '<button class="btn btn-primary" onclick="CbyF.openProjectForm()">+ Neues Projekt</button>';
    html += '</div>';

    if (!data.projects.length) {
      html += '<div class="empty-hint">Noch keine Projekte angelegt.</div>';
      return html;
    }

    html += '<div class="proj-grid">';
    data.projects.forEach(function (p) {
      var ts = tasksForProject(p.id);
      var counts = { offen: 0, in_bearbeitung: 0, pruefung: 0, erledigt: 0 };
      ts.forEach(function (t) { counts[t.status]++; });
      html += '<div class="proj-card' + (p.status === "abgeschlossen" ? " inactive" : "") + '">';
      html += '<h3>' + escapeHtml(p.name) + '</h3>';
      html += '<div class="badge">' + (p.status === "aktiv" ? "Aktiv" : "Abgeschlossen") + '</div>';
      html += '<div class="counts">';
      STATUS_ORDER.forEach(function (s) {
        html += '<div>' + STATUS_LABELS[s] + ': <span>' + formatNumber(counts[s]) + '</span></div>';
      });
      html += '</div>';
      html += '<div class="actions">';
      html += '<button class="btn btn-sm" onclick="CbyF.showProjectTasks(\'' + p.id + '\')">Aufgaben anzeigen</button>';
      if (isPL()) {
        html += '<button class="btn btn-sm" onclick="CbyF.openProjectForm(\'' + p.id + '\')">Bearbeiten</button>';
        html += '<button class="btn btn-sm" onclick="CbyF.deleteProject(\'' + p.id + '\')">Löschen</button>';
      }
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ---------- Admin ----------

  function renderAdminView() {
    var html = "";
    if (storageOK) {
      html += '<div class="storage-note">Automatische Speicherung aktiv – Daten bleiben in diesem Browser erhalten.</div>';
    } else {
      html += '<div class="storage-note warn">Automatische Speicherung ist in dieser Ansicht nicht verfügbar. Bitte regelmäßig als JSON sichern und bei Bedarf wieder einlesen, sonst gehen Änderungen beim Schließen verloren.</div>';
    }

    html += '<div class="section-title">Datensicherung</div>';
    html += '<div class="backup-row">';
    html += '<button class="btn btn-primary" onclick="CbyF.exportData()">Als JSON sichern</button>';
    html += '<input type="file" id="importFile" accept="application/json,.json">';
    html += '<button class="btn" onclick="CbyF.importData()">Datei einlesen</button>';
    html += '</div>';

    html += '<div class="section-title">Benutzerverwaltung</div>';
    html += '<table class="admin-table"><thead><tr><th>Name</th><th>Rolle</th><th></th></tr></thead><tbody>';
    data.users.forEach(function (u) {
      html += '<tr><td>' + escapeHtml(u.name) + '</td><td>' + (u.role === "PL" ? "Projektleiter" : "Mitarbeiter") + '</td><td>';
      html += '<button class="btn btn-sm" onclick="CbyF.deleteUser(\'' + u.id + '\')">Entfernen</button>';
      html += '</td></tr>';
    });
    html += '</tbody></table>';

    html += '<div class="section-title">Neuen Benutzer anlegen</div>';
    html += '<div class="filter-bar">';
    html += '<input type="text" id="newUserName" placeholder="Name">';
    html += '<select id="newUserRole"><option value="MA">Mitarbeiter</option><option value="PL">Projektleiter</option></select>';
    html += '<button class="btn btn-primary" onclick="CbyF.addUser()">Hinzufügen</button>';
    html += '</div>';
    return html;
  }

  // ---------- Modals ----------

  function renderModal() {
    var m = ui.modal;
    var html = '<div class="modal-backdrop" onclick="if(event.target===this) CbyF.closeModal()"><div class="modal">';

    if (m.type === "taskForm") html += renderTaskFormModal(m);
    else if (m.type === "taskDetail") html += renderTaskDetailModal(m);
    else if (m.type === "projectForm") html += renderProjectFormModal(m);

    html += '</div></div>';
    return html;
  }

  function renderTaskFormModal(m) {
    var editing = !!m.taskId;
    var t = editing ? data.tasks.find(function (x) { return x.id === m.taskId; }) : {
      title: "", description: "", projectId: "", deadline: "", priority: 2,
      knowledgeBase: "", category: "", keywords: "", childTaskId: "",
      location: "", url: "", estimatedEffort: "", contacts: "", actionField: ""
    };
    var html = '<h2>' + (editing ? "Aufgabe bearbeiten" : "Neue Aufgabe") + '</h2>';
    html += '<div class="field"><label>Titel *</label><input type="text" id="f_title" value="' + escapeHtml(t.title) + '"></div>';
    html += '<div class="field"><label>Beschreibung</label><textarea id="f_desc">' + escapeHtml(t.description) + '</textarea></div>';
    html += '<div class="row2">';
    html += '<div class="field"><label>Projekt</label><select id="f_project"><option value="">– kein Projekt –</option>';
    data.projects.forEach(function (p) {
      html += '<option value="' + p.id + '"' + (t.projectId === p.id ? " selected" : "") + '>' + escapeHtml(p.name) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="field"><label>Priorität</label><select id="f_priority">';
    [1, 2, 3].forEach(function (p) {
      html += '<option value="' + p + '"' + (t.priority === p ? " selected" : "") + '>' + PRIORITY_LABELS[p] + '</option>';
    });
    html += '</select></div>';
    html += '</div>';
    var deadlineParts = (t.deadline || "").split("T");
    var deadlineDateVal = deadlineParts[0] || "";
    var deadlineTimeVal = deadlineParts[1] || "08:00";
    html += '<div class="row2">';
    html += '<div class="field"><label>Frist (Datum)</label><input type="date" id="f_deadline_date" value="' + deadlineDateVal + '"></div>';
    html += '<div class="field"><label>Frist (Uhrzeit)</label><input type="time" id="f_deadline_time" value="' + deadlineTimeVal + '"></div>';
    html += '</div>';

    html += '<div class="row2">';
    html += '<div class="field"><label>Kategorie</label><select id="f_category"><option value="">– keine Kategorie –</option>';
    CATEGORY_OPTIONS.forEach(function (cat) {
      html += '<option value="' + escapeHtml(cat) + '"' + (t.category === cat ? " selected" : "") + '>' + escapeHtml(cat) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="field"><label>Knowledge Base</label><input type="text" id="f_kb" value="' + escapeHtml(t.knowledgeBase || "") + '"></div>';
    html += '</div>';

    html += '<div class="row2">';
    html += '<div class="field"><label>Schlagwörter</label><input type="text" id="f_keywords" value="' + escapeHtml(t.keywords || "") + '" placeholder="Komma-getrennt"></div>';
    html += '<div class="field"><label>Handlungsfelder</label><select id="f_action_field"><option value="">– keine Auswahl –</option>';
    ACTION_FIELD_OPTIONS.forEach(function (af) {
      html += '<option value="' + escapeHtml(af) + '"' + (t.actionField === af ? " selected" : "") + '>' + escapeHtml(af) + '</option>';
    });
    html += '</select></div>';
    html += '</div>';

    html += '<div class="row2">';
    html += '<div class="field"><label>Element (untergeordnet)</label><select id="f_child"><option value="">– keine Verknüpfung –</option>';
    data.tasks.forEach(function (x) {
      if (editing && x.id === t.id) return;
      html += '<option value="' + x.id + '"' + (t.childTaskId === x.id ? " selected" : "") + '>' + escapeHtml(x.title) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="field"><label>Ort (Map)</label><input type="text" id="f_location" value="' + escapeHtml(t.location || "") + '" oninput="CbyF.updateLocationLink(this.value)">';
    html += '<div style="margin-top:4px"><a id="f_location_link" class="btn-ghost" target="_blank" rel="noopener" href="' + (t.location ? mapsRouteUrl(t.location) : "#") + '" style="' + (t.location ? "" : "display:none") + '">Route in Google Maps öffnen</a></div></div>';
    html += '</div>';

    html += '<div class="row2">';
    html += '<div class="field"><label>URL</label><input type="text" id="f_url" value="' + escapeHtml(t.url || "") + '" placeholder="https://…" oninput="CbyF.updateUrlLink(this.value)">';
    html += '<div style="margin-top:4px"><a id="f_url_link" class="btn-ghost" target="_blank" rel="noopener" href="' + (t.url ? normalizeUrl(t.url) : "#") + '" style="' + (t.url ? "" : "display:none") + '">Link öffnen</a></div></div>';
    html += '<div class="field"><label>Geschätzter Aufwand (Std.)</label><input type="number" id="f_effort" min="0" step="0.5" value="' + (t.estimatedEffort === null || t.estimatedEffort === undefined ? "" : t.estimatedEffort) + '"></div>';
    html += '</div>';

    html += '<div class="field"><label>Kontakte</label><input type="text" id="f_contacts" value="' + escapeHtml(t.contacts || "") + '" placeholder="Komma-getrennt"></div>';

    html += '<div class="modal-actions">';
    html += '<button class="btn" onclick="CbyF.closeModal()">Abbrechen</button>';
    html += '<button class="btn btn-primary" onclick="CbyF.saveTaskForm(' + (editing ? "'" + t.id + "'" : "null") + ')">Speichern</button>';
    html += '</div>';
    return html;
  }

  function renderTaskDetailModal(m) {
    var t = data.tasks.find(function (x) { return x.id === m.taskId; });
    if (!t) return "<p>Aufgabe nicht gefunden.</p>";
    var html = '<h2>' + escapeHtml(t.title) + '</h2>';
    html += '<div class="meta">';
    html += '<span class="badge prio-' + t.priority + '">' + PRIORITY_LABELS[t.priority] + '</span>';
    html += '<span class="badge">' + STATUS_LABELS[t.status] + '</span>';
    html += '<span class="badge">' + escapeHtml(projectName(t.projectId)) + '</span>';
    html += '</div>';
    html += '<p>' + escapeHtml(t.description || "– keine Beschreibung –") + '</p>';
    html += '<div class="meta">Frist: <span class="mono' + (isOverdue(t) ? " deadline overdue" : "") + '">' + formatDate(t.deadline) + '</span></div>';
    html += '<div class="meta">Bearbeiter: ' + escapeHtml(t.assigneeId ? userName(t.assigneeId) : "– offen –") + '</div>';
    if (t.category) html += '<div class="meta">Kategorie: ' + escapeHtml(t.category) + '</div>';
    if (t.knowledgeBase) html += '<div class="meta">Knowledge Base: ' + escapeHtml(t.knowledgeBase) + '</div>';
    if (t.keywords) html += '<div class="meta">Schlagwörter: ' + escapeHtml(t.keywords) + '</div>';
    if (t.actionField) html += '<div class="meta">Handlungsfelder: <span class="badge">' + escapeHtml(t.actionField) + '</span></div>';
    if (t.childTaskId) html += '<div class="meta">Element (untergeordnet): ' + escapeHtml(taskTitle(t.childTaskId)) + '</div>';
    if (t.location) html += '<div class="meta">Ort: ' + escapeHtml(t.location) + ' &middot; <a href="' + mapsRouteUrl(t.location) + '" target="_blank" rel="noopener">Route in Google Maps öffnen</a></div>';
    if (t.url) html += '<div class="meta">URL: <a href="' + escapeHtml(normalizeUrl(t.url)) + '" target="_blank" rel="noopener">' + escapeHtml(t.url) + '</a></div>';
    if (t.estimatedEffort !== null && t.estimatedEffort !== undefined && t.estimatedEffort !== "") html += '<div class="meta">Geschätzter Aufwand: <span class="mono">' + formatNumber(t.estimatedEffort) + '</span> Std.</div>';
    if (t.contacts) html += '<div class="meta">Kontakte: ' + escapeHtml(t.contacts) + '</div>';

    if (t.assigneeId === currentUser().id && t.status === "in_bearbeitung") {
      html += '<div class="field"><label>Fortschritt: <span id="progressVal" class="mono">' + t.progress + '</span> %</label>';
      html += '<input type="range" min="0" max="100" step="5" value="' + t.progress + '" oninput="document.getElementById(\'progressVal\').textContent=this.value" onchange="CbyF.updateProgress(\'' + t.id + '\', this.value)"></div>';
    } else {
      html += '<div class="progress-outer"><div class="progress-inner" style="width:' + t.progress + '%"></div></div><div class="meta mono">' + formatNumber(t.progress) + ' %</div>';
    }

    html += '<div class="section-title" style="margin-top:16px">Notizen</div>';
    if (!t.notes.length) html += '<div class="empty-hint">Noch keine Notizen.</div>';
    t.notes.slice().reverse().forEach(function (n) {
      html += '<div class="note-item"><div>' + escapeHtml(n.text) + '</div><div class="meta">' + escapeHtml(n.author) + ' &middot; ' + formatDateTime(n.ts) + '</div></div>';
    });
    html += '<div class="field" style="margin-top:8px"><textarea id="newNoteText" placeholder="Notiz hinzufügen…"></textarea>';
    html += '<button class="btn btn-sm" style="margin-top:6px" onclick="CbyF.addNote(\'' + t.id + '\')">Notiz speichern</button></div>';

    html += '<div class="section-title">Historie</div>';
    t.history.slice().reverse().forEach(function (h) {
      html += '<div class="hist-item"><div>' + escapeHtml(h.text) + '</div><div class="meta">' + escapeHtml(h.author) + ' &middot; ' + formatDateTime(h.ts) + '</div></div>';
    });

    html += '<div class="modal-actions">';
    if (isPL()) html += '<button class="btn" onclick="CbyF.openTaskForm(\'' + t.id + '\')">Bearbeiten</button>';
    html += '<button class="btn btn-primary" onclick="CbyF.closeModal()">Schließen</button>';
    html += '</div>';
    return html;
  }

  function renderProjectFormModal(m) {
    var editing = !!m.projectId;
    var p = editing ? data.projects.find(function (x) { return x.id === m.projectId; }) : { name: "", status: "aktiv" };
    var html = '<h2>' + (editing ? "Projekt bearbeiten" : "Neues Projekt") + '</h2>';
    html += '<div class="field"><label>Name *</label><input type="text" id="p_name" value="' + escapeHtml(p.name) + '"></div>';
    html += '<div class="field"><label>Status</label><select id="p_status">';
    html += '<option value="aktiv"' + (p.status === "aktiv" ? " selected" : "") + '>Aktiv</option>';
    html += '<option value="abgeschlossen"' + (p.status === "abgeschlossen" ? " selected" : "") + '>Abgeschlossen</option>';
    html += '</select></div>';
    html += '<div class="modal-actions">';
    html += '<button class="btn" onclick="CbyF.closeModal()">Abbrechen</button>';
    html += '<button class="btn btn-primary" onclick="CbyF.saveProjectForm(' + (editing ? "'" + p.id + "'" : "null") + ')">Speichern</button>';
    html += '</div>';
    return html;
  }

  // ---------- Actions ----------

  var CbyF = {
    setTab: function (tab) { ui.tab = tab; render(); },

    switchUser: function (id) { data.currentUserId = id; saveData(); render(); },

    updateFilter: function (key, value) {
      ui.filters[key] = value;
      renderPoolList();
    },

    openTaskForm: function (taskId) { ui.modal = { type: "taskForm", taskId: taskId || null, focusId: "f_title" }; render(); },
    openTaskDetail: function (taskId) { ui.modal = { type: "taskDetail", taskId: taskId }; render(); },
    openProjectForm: function (projectId) { ui.modal = { type: "projectForm", projectId: projectId || null, focusId: "p_name" }; render(); },
    closeModal: function () { ui.modal = null; render(); },

    updateLocationLink: function (value) {
      var link = document.getElementById("f_location_link");
      if (!link) return;
      value = value.trim();
      if (value) {
        link.href = mapsRouteUrl(value);
        link.style.display = "";
      } else {
        link.style.display = "none";
      }
    },

    updateUrlLink: function (value) {
      var link = document.getElementById("f_url_link");
      if (!link) return;
      var normalized = normalizeUrl(value);
      if (normalized) {
        link.href = normalized;
        link.style.display = "";
      } else {
        link.style.display = "none";
      }
    },

    saveTaskForm: function (taskId) {
      var title = document.getElementById("f_title").value.trim();
      if (!title) { alert("Bitte einen Titel angeben."); return; }
      var desc = document.getElementById("f_desc").value.trim();
      var projectId = document.getElementById("f_project").value || null;
      var priority = parseInt(document.getElementById("f_priority").value, 10);
      var deadlineDate = document.getElementById("f_deadline_date").value;
      var deadlineTime = document.getElementById("f_deadline_time").value || "08:00";
      var deadline = deadlineDate ? (deadlineDate + "T" + deadlineTime) : null;

      var category = document.getElementById("f_category").value.trim();
      var knowledgeBase = document.getElementById("f_kb").value.trim();
      var keywords = document.getElementById("f_keywords").value.trim();
      var actionField = document.getElementById("f_action_field").value || "";
      var childTaskId = document.getElementById("f_child").value || null;
      var location = document.getElementById("f_location").value.trim();
      var url = document.getElementById("f_url").value.trim();
      var effortRaw = document.getElementById("f_effort").value;
      var estimatedEffort = effortRaw === "" ? null : parseFloat(effortRaw);
      var contacts = document.getElementById("f_contacts").value.trim();

      if (taskId) {
        var t = data.tasks.find(function (x) { return x.id === taskId; });
        t.title = title; t.description = desc; t.projectId = projectId; t.priority = priority; t.deadline = deadline;
        t.category = category; t.knowledgeBase = knowledgeBase; t.keywords = keywords; t.childTaskId = childTaskId;
        t.location = location; t.url = url; t.estimatedEffort = estimatedEffort; t.contacts = contacts;
        t.actionField = actionField;
        addHistory(t, "Aufgabe bearbeitet");
      } else {
        data.tasks.push({
          id: uid(), title: title, description: desc, projectId: projectId, deadline: deadline,
          priority: priority, status: "offen", assigneeId: null, progress: 0,
          category: category, knowledgeBase: knowledgeBase, keywords: keywords, childTaskId: childTaskId,
          location: location, url: url, estimatedEffort: estimatedEffort, contacts: contacts,
          actionField: actionField,
          notes: [], history: [{ ts: Date.now(), text: "Angelegt", author: currentUser().name }]
        });
      }
      saveData();
      ui.modal = null;
      render();
    },

    pullTask: function (id) {
      var t = data.tasks.find(function (x) { return x.id === id; });
      t.status = "in_bearbeitung"; t.assigneeId = currentUser().id;
      addHistory(t, "Aufgabe geholt von " + currentUser().name);
      saveData(); render();
    },
    returnTask: function (id) {
      var t = data.tasks.find(function (x) { return x.id === id; });
      addHistory(t, "Zurückgelegt in den Pool (war: " + userName(t.assigneeId) + ")");
      t.status = "offen"; t.assigneeId = null;
      saveData(); render();
    },
    submitForReview: function (id) {
      var t = data.tasks.find(function (x) { return x.id === id; });
      t.status = "pruefung";
      addHistory(t, "Zur Prüfung eingereicht");
      saveData(); render();
    },
    approveTask: function (id) {
      var t = data.tasks.find(function (x) { return x.id === id; });
      t.status = "erledigt"; t.progress = 100;
      addHistory(t, "Freigegeben und abgeschlossen");
      saveData(); render();
    },
    rejectTask: function (id) {
      var reason = prompt("Grund der Zurückweisung (optional):", "");
      var t = data.tasks.find(function (x) { return x.id === id; });
      t.status = "in_bearbeitung";
      addHistory(t, "Zurück an Bearbeitung" + (reason ? ": " + reason : ""));
      saveData(); render();
    },
    reopenTask: function (id) {
      var t = data.tasks.find(function (x) { return x.id === id; });
      t.status = "in_bearbeitung";
      addHistory(t, "Wiedereröffnet");
      saveData(); render();
    },
    deleteTask: function (id) {
      if (!confirm("Aufgabe wirklich löschen?")) return;
      data.tasks = data.tasks.filter(function (x) { return x.id !== id; });
      saveData(); render();
    },
    updateProgress: function (id, value) {
      var t = data.tasks.find(function (x) { return x.id === id; });
      t.progress = parseInt(value, 10);
      addHistory(t, "Fortschritt aktualisiert: " + t.progress + " %");
      saveData(); render();
    },
    addNote: function (id) {
      var el = document.getElementById("newNoteText");
      var text = el.value.trim();
      if (!text) return;
      var t = data.tasks.find(function (x) { return x.id === id; });
      t.notes.push({ id: uid(), text: text, author: currentUser().name, ts: Date.now() });
      saveData(); render();
    },

    saveProjectForm: function (projectId) {
      var name = document.getElementById("p_name").value.trim();
      if (!name) { alert("Bitte einen Projektnamen angeben."); return; }
      var status = document.getElementById("p_status").value;
      if (projectId) {
        var p = data.projects.find(function (x) { return x.id === projectId; });
        p.name = name; p.status = status;
      } else {
        data.projects.push({ id: uid(), name: name, status: status });
      }
      saveData(); ui.modal = null; render();
    },
    deleteProject: function (id) {
      if (tasksForProject(id).length) { alert("Projekt kann nicht gelöscht werden, solange Aufgaben zugeordnet sind."); return; }
      if (!confirm("Projekt wirklich löschen?")) return;
      data.projects = data.projects.filter(function (x) { return x.id !== id; });
      saveData(); render();
    },
    showProjectTasks: function (id) {
      ui.tab = "pool";
      ui.filters.projectId = id;
      ui.filters.status = "alle";
      render();
    },

    addUser: function () {
      var name = document.getElementById("newUserName").value.trim();
      var role = document.getElementById("newUserRole").value;
      if (!name) { alert("Bitte einen Namen angeben."); return; }
      data.users.push({ id: uid(), name: name, role: role });
      saveData(); render();
    },
    deleteUser: function (id) {
      if (id === currentUser().id) { alert("Der aktuell angemeldete Benutzer kann nicht entfernt werden."); return; }
      var hasActive = data.tasks.some(function (t) { return t.assigneeId === id && t.status !== "erledigt"; });
      if (hasActive) { alert("Benutzer ist noch aktiven Aufgaben zugeordnet und kann nicht entfernt werden."); return; }
      if (!confirm("Benutzer wirklich entfernen?")) return;
      data.users = data.users.filter(function (x) { return x.id !== id; });
      saveData(); render();
    },

    exportData: function () {
      var json = JSON.stringify(data, null, 2);
      var filename = "pull-project-" + todayISO() + ".json";
      if (window.claude && window.claude.downloads) {
        window.claude.downloads.save({ filename: filename, data: json }).catch(function (err) {
          if (err && err.code === "declined") return;
          alert("Sicherung konnte nicht gespeichert werden (" + (err && err.code ? err.code : "Fehler") + ").");
        });
      } else {
        var blob = new Blob([json], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    },
    importData: function () {
      var input = document.getElementById("importFile");
      var file = input && input.files && input.files[0];
      if (!file) { alert("Bitte zuerst eine JSON-Datei auswählen."); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (e) {
          alert("Die Datei ist kein gültiges JSON.");
          return;
        }
        if (!parsed || !Array.isArray(parsed.users) || !parsed.users.length) {
          alert("Die Datei enthält kein gültiges Pull-Project-Format.");
          return;
        }
        if (!confirm("Aktuelle Daten in dieser Ansicht durch die Datei ersetzen?")) return;
        data = parsed;
        if (!data.projects) data.projects = [];
        if (!data.tasks) data.tasks = [];
        if (!data.users.some(function (u) { return u.id === data.currentUserId; })) data.currentUserId = data.users[0].id;
        saveData();
        render();
      };
      reader.readAsText(file);
    }
  };

  window.CbyF = CbyF;
  render();
})();
</script>
</body>
</html>
